name: Update repository dashboard

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate DASHBOARD.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional personal access token (read access to all repositories) to include private repos.
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: python dashboard/generate.py
      - name: Commit changes
        run: |
          if git diff --quiet -- DASHBOARD.md; then
            echo "Dashboard already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD.md
          git commit -m "chore: refresh repository dashboard"
          git push
